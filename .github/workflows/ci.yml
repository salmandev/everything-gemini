name: CI & Harness Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate Skills, Rules & Hooks
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Executable Permissions
        run: |
          chmod +x scripts/validate.sh scripts/install.sh bin/everything-gemini
          find hooks/ -type f -name "*.sh" -exec chmod +x {} +
          find skills/ -type f -name "*.sh" -exec chmod +x {} +

      - name: Run Everything Gemini Test Suite
        run: npm test

      - name: Verify CLI Doctor & Listing
        run: |
          node bin/everything-gemini doctor
          node bin/everything-gemini list

      - name: Verify Skill Validation & Info CLI
        run: |
          node bin/everything-gemini test-skill agent-evals
          node bin/everything-gemini info agent-evals
          node bin/everything-gemini info planner
          node bin/everything-gemini info gemini-shield
          node bin/everything-gemini info antigravity-sdk-orchestrator

      - name: Verify Benchmark & Shell Completion
        run: |
          npm run benchmark
          npm run completion
          node bin/everything-gemini --version

      - name: Verify Installer Script (install.sh)
        run: |
          bash scripts/install.sh --profile developer --workspace ./tmp-ci-agents

      - name: Self-Test Composite GitHub Action (action.yml)
        uses: ./
        with:
          profile: developer
          global: false
          workspace: ./tmp-action-agents

      - name: Verify Component Add & Remove CLI
        run: |
          node bin/everything-gemini add skill tdd-workflow
          node bin/everything-gemini remove skill tdd-workflow
          node bin/everything-gemini add hook safety-shield
          node bin/everything-gemini remove hook safety-shield

      - name: Cleanup Temporary Test Directories
        run: |
          node -e "['./tmp-ci-agents', './tmp-action-agents'].forEach(d => { try { require('fs').rmSync(d, {recursive: true, force: true}); } catch(e){} })"
